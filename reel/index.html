<script>
(() => {
'use strict';
// ======================================================================
// Time grid: 120 BPM, 72 beats, 36 s. The last frame flows into the first.
// ======================================================================
const BPM = 120, BEAT = 60 / BPM, NB = 72, T = NB * BEAT;
const b = n => n * BEAT;
const COL = { canvas:'#E9E8E4', ink:'#0B0D11', navy:'#2C3A52', slate:'#556886', silver:'#C4CAD3', mute:'#6B717C', white:'#FFFFFF', line:'#DEDDD8' };

// ---------- math ----------
const clamp = (x, a, c) => Math.max(a, Math.min(c, x));
const c01 = x => clamp(x, 0, 1);
const lerp = (a, c, u) => a + (c - a) * u;
const eOut3 = u => 1 - Math.pow(1 - u, 3);
const eIn2 = u => u * u;
const eInOut3 = u => u < .5 ? 4 * u * u * u : 1 - Math.pow(-2 * u + 2, 3) / 2;
const wrap = t => ((t % T) + T) % T;

// Closed-form spring step response: starts at rest at 0, settles at 1.
function S(tau, resp, damp) {
  if (resp <= 0) return tau >= 0 ? 1 : 0;
  if (tau <= 0) return 0;
  const w = 2 * Math.PI / resp;
  if (damp >= 1) { const x = w * tau; return 1 - Math.exp(-x) * (1 + x); }
  const wd = w * Math.sqrt(1 - damp * damp);
  return 1 - Math.exp(-damp * w * tau) * (Math.cos(wd * tau) + (damp * w / wd) * Math.sin(wd * tau));
}
// A value whose target changes many times = sum of one spring per change.
// Each change also contributes from the previous loop, so the function is periodic in T.
const TRACKS = [];
const SOFT = 1.0;    // global spring softness (response multiplier)
const DAMP = .92;    // damping floor: everything glides into place, no wobble
const VS = 1.3;      // global text enter/exit duration multiplier
class Tr {
  constructor(v0, resp = .5, damp = .86, name = '') { this.v0 = v0; this.last = v0; this.ev = []; this.r = resp; this.d = damp; this.name = name; TRACKS.push(this); }
  to(t, v, r = this.r, d = this.d) { const dv = v - this.last; if (Math.abs(dv) > 1e-9) this.ev.push([t, dv, r * SOFT, r > 0 ? Math.max(d, DAMP) : d]); this.last = v; return this; }
  jump(t, v) { return this.to(t, v, 0, 1); }
  at(t) { let v = this.v0; for (const e of this.ev) v += e[1] * (S(t - e[0], e[2], e[3]) + S(t - e[0] + T, e[2], e[3])); return v; }
}
const hex = h => { const n = parseInt(h.slice(1), 16); return [(n >> 16) & 255, (n >> 8) & 255, n & 255]; };
class TrC {
  constructor(h, r = .4, d = 1) { this.c = hex(h).map(v => new Tr(v, r, d)); }
  to(t, h, r, d) { hex(h).forEach((v, i) => this.c[i].to(t, v, r, d)); return this; }
  jump(t, h) { hex(h).forEach((v, i) => this.c[i].jump(t, v)); return this; }
  rgb(t) { return this.c.map(tr => clamp(tr.at(t), 0, 255)); }
  at(t) { const [r, g, bb] = this.rgb(t); return `rgb(${r.toFixed(1)},${g.toFixed(1)},${bb.toFixed(1)})`; }
}
// Press pulse: dips then recovers around a click at tc (periodic).
function pulse(t, tc, amp, down = .16, up = .34) {
  let v = 0;
  for (const k of [0, T, -T]) { const u = t + k; v += amp * (S(u - (tc - .07), down, .8) - S(u - (tc + .05), up, .82)); }
  return v;
}
// Presence of an element entering at a and exiting at z (periodic). Returns {v, s}.
function vis(t, a, z, inD = .26, outD = .14) {
  inD *= VS; outD *= VS;
  let best = 0, side = 1;
  for (const k of [0, T, -T]) {
    const u = t + k;
    if (u < a || u >= z + outD) continue;
    let v, s;
    if (u < z) { v = eOut3(c01((u - a) / inD)); s = 1; }
    else { v = eOut3(c01((z - a) / inD)) * (1 - eIn2(c01((u - z) / outD))); s = -1; }
    if (v > best) { best = v; side = s; }
  }
  return { v: best, s: side };
}
const inWin = (t, a, z) => { for (const k of [0, T, -T]) { const u = t + k; if (u >= a && u < z) return true; } return false; };
const since = (t, a) => { const d = wrap(t - a); return d; };  // time since a (periodic)

// ---------- DOM ----------
const $ = id => document.getElementById(id);
function mk(tag, parent, cls, style, html) {
  const e = document.createElement(tag);
  if (cls) e.className = cls;
  if (style) e.style.cssText = style;
  if (html != null) e.innerHTML = html;
  parent.appendChild(e);
  return e;
}
const SVGNS = 'http://www.w3.org/2000/svg';
const ICONS = {
  car: '<path d="m21 8-2 2-1.5-3.7A2 2 0 0 0 15.646 5H8.4a2 2 0 0 0-1.903 1.257L5 10 3 8"/><path d="M7 14h.01"/><path d="M17 14h.01"/><rect width="18" height="8" x="3" y="10" rx="2"/><path d="M5 18v2"/><path d="M19 18v2"/>',
  filex: '<path d="M6 22a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h8a2.4 2.4 0 0 1 1.704.706l3.588 3.588A2.4 2.4 0 0 1 20 8v12a2 2 0 0 1-2 2z"/><path d="M14 2v5a1 1 0 0 0 1 1h5"/><path class="x" d="m14.5 12.5-5 5"/><path class="x" d="m9.5 12.5 5 5"/>',
  hourglass: '<path d="M5 22h14"/><path d="M5 2h14"/><path d="M17 22v-4.172a2 2 0 0 0-.586-1.414L12 12l-4.414 4.414A2 2 0 0 0 7 17.828V22"/><path d="M7 2v4.172a2 2 0 0 0 .586 1.414L12 12l4.414-4.414A2 2 0 0 0 17 6.172V2"/>',
  check: '<path d="M20 6 9 17l-5-5"/>',
  phone: '<path d="M13.832 16.568a1 1 0 0 0 1.213-.303l.355-.465A2 2 0 0 1 17 15h3a2 2 0 0 1 2 2v3a2 2 0 0 1-2 2A18 18 0 0 1 2 4a2 2 0 0 1 2-2h3a2 2 0 0 1 2 2v3a2 2 0 0 1-.8 1.6l-.468.351a1 1 0 0 0-.292 1.233 14 14 0 0 0 6.392 6.384"/>',
  pause: '<rect x="14" y="4" width="4" height="16" rx="1"/><rect x="6" y="4" width="4" height="16" rx="1"/>',
  at: '<circle cx="12" cy="12" r="4"/><path d="M16 8v5a3 3 0 0 0 6 0v-1a10 10 0 1 0-4 8"/>',
  pin: '<path d="M20 10c0 4.993-5.539 10.193-7.399 11.799a1 1 0 0 1-1.202 0C9.539 20.193 4 14.993 4 10a8 8 0 0 1 16 0"/><circle cx="12" cy="10" r="3"/>',
  chev: '<path d="m15 18-6-6 6-6"/>',
};
// All icons render with the same on-screen stroke: 3.4px at their drawn size.
const STROKE = 3.4;
function icon(parent, name, size, color, style = '') {
  const s = document.createElementNS(SVGNS, 'svg');
  s.setAttribute('viewBox', '0 0 24 24');
  s.setAttribute('width', size); s.setAttribute('height', size);
  s.setAttribute('class', 'ic a');
  s.style.cssText = `stroke:${color};stroke-width:${(STROKE * 24 / size).toFixed(3)};overflow:visible;` + style;
  s.innerHTML = ICONS[name];
  s.querySelectorAll('path,rect,circle').forEach(p => p.setAttribute('pathLength', '1'));
  parent.appendChild(s);
  return s;
}
function drawIcon(svg, p, sel = 'path,rect,circle') {
  svg.querySelectorAll(sel).forEach(el => { el.style.strokeDasharray = '1 1'; el.style.strokeDashoffset = (1 - c01(p)).toFixed(4); });
}

// ======================================================================
// Scene graph
// ======================================================================
const stage = $('stage');
const world = mk('div', stage, 'a', 'width:1080px;height:1920px;transform-origin:0 0;');
const shadow = '0 50px 110px -30px rgba(18,24,36,.30), 0 14px 34px -14px rgba(18,24,36,.22)';
const shape = mk('div', world, 'a', `overflow:hidden;box-shadow:${shadow};transform-origin:50% 50%;`);
const shapeIn = mk('div', shape, 'a', 'width:1080px;height:1920px;');
const onCanvas = mk('div', world, 'a', 'width:1080px;height:1920px;'); // text that lives on the canvas (outside the shape)
const media = mk('div', world, 'a', 'overflow:hidden;background:#11151c;');
const mImg = [mk('img', media, 'a'), mk('img', media, 'a')];
mImg.forEach(im => { im.decoding = 'sync'; im.style.transformOrigin = '0 0'; });
const mIcon = mk('div', media, 'a', 'width:100%;height:100%;background:#fff;visibility:hidden;');
const mIconSvg = icon(mIcon, 'phone', 46, COL.navy, 'left:50%;top:50%;transform:translate(-50%,-50%);');
const mRing = mk('div', world, 'a', 'border-radius:50%;border:4px solid #fff;visibility:hidden;');
const worldTop = mk('div', world, 'a', 'width:1080px;height:1920px;');
const ov = mk('div', stage, 'a', 'width:1080px;height:1920px;');
const cursorEl = mk('div', stage, 'a', 'transform-origin:0 0;filter:drop-shadow(0 6px 10px rgba(0,0,0,.22));');
cursorEl.innerHTML = '<svg width="36" height="52" viewBox="-2 -2 36 52" style="display:block;overflow:visible"><path d="M1.5 1.5 L1.5 38.5 L10.6 30.4 L16.6 44.6 L23.4 41.7 L17.4 27.8 L29.6 27.8 Z" fill="#0B0D11" stroke="#fff" stroke-width="2.6" stroke-linejoin="round"/></svg>';

// ---------- tracks: shape, camera, media, cursor ----------
const SH = { x: new Tr(540), y: new Tr(900), w: new Tr(300), h: new Tr(300), r: new Tr(70), col: new TrC(COL.navy) };
function shapeTo(t, s, r = .55, d = .86) {
  SH.x.to(t, s.x, r, d); SH.y.to(t, s.y, r, d); SH.w.to(t, s.w, r, d); SH.h.to(t, s.h, r, d); SH.r.to(t, s.r, r, d);
  if (s.col) SH.col.to(t, s.col, r * .7, 1);
}
function shapeJump(t, s) { ['x','y','w','h','r'].forEach(k => SH[k].jump(t, s[k])); if (s.col) SH.col.jump(t, s.col); }
const CAM = { x: new Tr(540), y: new Tr(915), lz: new Tr(Math.log(1.7)) };
function camTo(t, x, y, z, r = .7, d = .9) { CAM.x.to(t, x, r, d); CAM.y.to(t, y, r, d); CAM.lz.to(t, Math.log(z), r, d); }
function camJump(t, x, y, z) { CAM.x.jump(t, x); CAM.y.jump(t, y); CAM.lz.jump(t, Math.log(z)); }
const MD = { x: new Tr(540), y: new Tr(900), w: new Tr(0), h: new Tr(0), r: new Tr(0), o: new Tr(0) };
function mediaTo(t, m, r = .55, d = .86) { ['x','y','w','h','r'].forEach(k => MD[k].to(t, m[k], r, d)); if (m.o != null) MD.o.to(t, m.o, .25, 1); }
function mediaJump(t, m) { ['x','y','w','h','r','o'].forEach(k => { if (m[k] != null) MD[k].jump(t, m[k]); }); }
const CUR = { x: new Tr(560), y: new Tr(930) };
function curTo(t, x, y, r = .5, d = .9) { CUR.x.to(t, x, r, d); CUR.y.to(t, y, r, d); }
const SC = new Tr(1); // shape scale (success pulse)

// ---------- sound events (read by the audio builder) ----------
const EVENTS = [];
const ev = (t, k, extra = {}) => EVENTS.push(Object.assign({ t: +t.toFixed(4), k }, extra));
const CLICKS = [];   // cursor clicks (press pulse)
const click = (t, k = 'click') => { CLICKS.push(t); ev(t, k); };

// ======================================================================
// ACT 1 — ICON → notification pill with three questions (b0–b5)
// ======================================================================
const ICON = { x: 540, y: 900, w: 300, h: 300, r: 70, col: COL.navy };
const QUEST = [
  { t: b(0), text: 'נפגעתם בתאונת דרכים?', icon: 'car' },
  { t: b(2), text: 'ביטוח לאומי דחה אתכם?', icon: 'filex' },
  { t: b(4), text: 'מחכים לוועדה רפואית?', icon: 'hourglass' },
];

QUEST.forEach(q => {

});

// ======================================================================
// ACT 2 — statement card (b6–b9)
// ======================================================================
const ST = { x: 540, y: 900, w: 940, h: 1000, r: 72, col: COL.ink };
const stL1 = mk('div', shapeIn, 't', 'font-size:176px;font-weight:800;color:#fff;letter-spacing:-.02em;visibility:visible;display:flex;gap:44px;');
const stW = [mk('span', stL1, '', 'display:inline-block;', 'אתם'), mk('span', stL1, '', 'display:inline-block;', 'לא')];
const stL2 = mk('div', shapeIn, 't', 'font-size:338px;font-weight:900;color:#fff;letter-spacing:-.03em;', 'לבד.');
const stSub = mk('div', shapeIn, 't', `font-size:52px;font-weight:500;color:${COL.silver};`, 'יש מי שהולך איתכם <span class="hl2" style="position:relative;display:inline-block;color:#fff">עד הסוף<i style="position:absolute;left:0;right:0;bottom:-10px;height:5px;border-radius:3px;background:#fff;transform-origin:100% 50%;display:block"></i></span>.');

// ======================================================================
// ACT 3 — logo build (b10–b19) + dive into the monogram (b19–b21)
// ======================================================================
const LG_SQ = { x: 540, y: 900, w: 880, h: 880, r: 80, col: COL.navy };
const LG_TALL = { x: 540, y: 900, w: 880, h: 936, r: 80, col: COL.navy };
const LP = { x: new Tr(540), y: new Tr(900), s: new Tr(600) };   // logo placement (world)
const LS = new Tr(1);                                              // lock pulse
// piece polygons in logo units (1254 square) — M left, M right, B bottom, B top
const U1 = x => 203 + 0.684 * (x - 118), L1 = x => 370 + 0.694 * (x - 175);
const U2 = x => 553 - 0.688 * (x - 630), L2 = x => 686 - 0.698 * (x - 630);

  { poly: [[1214,1200],[1214,U2(1214)],[630,U2(630)],[630,L2(630)],[1060,L2(1060)],[1060,1200]], t: b(12), from: [640, 130, 9] },
  { poly: [[195,1200],[195,L1(195)],[630,L1(630)],[1060,L2(1060)],[1060,1200]], t: b(13), from: [0, 760, 0] },
  { poly: [[200,80],[1060,80],[1060,U2(1060)],[630,U2(630)],[200,U1(200)]], t: b(14), from: [90, -760, 5] },
];
const lgClip = mk('div', ov, 'a', 'width:1080px;height:1920px;');

const lgFull = mk('img', lgClip, 'a', 'width:1254px;height:1254px;transform-origin:0 0;visibility:hidden;');
lgFull.src = 'assets/logo_mono.png';
const sheenBox = mk('div', lgClip, 'a', 'width:1254px;height:1254px;transform-origin:0 0;visibility:hidden;mix-blend-mode:screen;-webkit-mask-image:url(assets/logo_mono.png);mask-image:url(assets/logo_mono.png);-webkit-mask-size:100% 100%;mask-size:100% 100%;overflow:hidden;');

const SERV = [
  { t: b(27), title: 'נזיקין ותאונות דרכים', val: 'נלחמים על <span class="hl"><i></i><span class="hlw">כל שקל</span></span> שמגיע לכם.', hl: b(28) },

// camera (with the dive override)
// ======================================================================
function drift(t) {
  const w = p => 2 * Math.PI * t / p;                 // periods divide T, so the loop stays seamless
  const quiet = 1 - c01((t - b(23.2)) / .3) * (1 - c01((t - b(26.4)) / .4));   // hold still while the footage is full frame
  return { dz: .014 * (.5 + .5 * Math.sin(w(4) - 1.2)) * quiet, dx: 5 * Math.sin(w(12) + .7) * quiet, dy: 4 * Math.sin(w(9)) * quiet };
}
function camBase(t) { const d = drift(t); return { x: CAM.x.at(t) + d.dx, y: CAM.y.at(t) + d.dy, z: Math.exp(CAM.lz.at(t)) * (1 + d.dz) }; }
function logoWorldPoint(t, u, v) { const x = LP.x.at(t), y = LP.y.at(t), s = LP.s.at(t); return [x + (u / 1254 - .5) * s, y + (v / 1254 - .5) * s]; }
function camera(t) {
  const t0 = b(22), t1 = b(24);
  if (t >= t0 && t < t1) {
    // the dive rides on top of the camera's own push, so it starts with the same velocity
    const base = camBase(t), c0 = camBase(t0);
    const P = logoWorldPoint(t, DIVE_P[0], DIVE_P[1]);
    const u = (t - t0) / (t1 - t0);
    const z = base.z * Math.exp(Math.log(46 / c0.z) * Math.pow(u, 2.6));
    const s0 = [(P[0] - base.x) * base.z + 540, (P[1] - base.y) * base.z + 960];
    const e = eInOut3(c01(u * 1.25));
    const s = [lerp(s0[0], 540, e), lerp(s0[1], 960, e)];
    return { x: P[0] - (s[0] - 540) / z, y: P[1] - (s[1] - 960) / z, z };
  }
  return camBase(t);
}
const toScreen = (c, x, y) => [(x - c.x) * c.z + 540, (y - c.y) * c.z + 960];

    place(qSig, 540, 1140, vis(t, b(54), b(56) + .06, .3, .14), { anchor: 'c', dy: 14 });
    const d = since(t, b(55));
    const V = vis(t, b(55), b(56), .01, .14);
    if (V.v > .003) {
      showEl(avRing);
      const p = eOut3(c01(d / .5));
      const sz = Q_AV.w + 26 + 40 * p;
      avRing.style.opacity = (1 - p) * V.v;
      box(avRing, Q_AV.x, Q_AV.y, sz, sz, sz / 2);
    } else hide(avRing);
  }

  // ---------- ACT 8: call ----------
  {
    place(clTitle, 540, 846, vis(t, b(56) + .12, b(60), .32, .14), { anchor: 'c', dy: 20 });
    const Vl = vis(t, b(56) + .16, CALL.grab + .75, .3, .3);
    place(clLabel, 500, 1000, Vl, { anchor: 'c', dy: 12, blur: 8 });
    clChev.forEach((c, i) => {
      if (Vl.v > .003) {
        c.style.visibility = 'visible';
        const ph = ((t - b(56)) * 2 - i * .18) % 1;
        const a = .25 + .75 * Math.pow(Math.max(0, Math.sin(Math.PI * c01(ph))), 2);
        c.style.opacity = Vl.v * a;
        c.style.transform = `translate(${270 - i * 26 - 20}px,${1000 - 20}px)`;
      } else c.style.visibility = 'hidden';
    });
    place(clNum, 520, 1000, vis(t, CALL.rel + .08, b(60), .3, .14), { anchor: 'c', dy: 14 });
  }

  // ---------- ACT 9: CTA ----------
  place(iconLabel, 540, 1086, vis(t, b(69.6), T, .4, .12), { anchor: 'c', dy: 12, blur: 8 });
  {
    const L = CT_LAYOUT;
    // logo (CTA + icon): enters at b52, stays through the loop point, exits as the pill forms
    const Vg = vis(t, b(60) + .1, T, .34, .16);
    if (Vg.v > .003) {
      showEl(logoEl);
      const x = LG2.x.at(t), y = LG2.y.at(t), s = LG2.s.at(t);
      const bl = (1 - Vg.v) * 10;
      logoEl.style.opacity = Vg.v; logoEl.style.filter = bl > .05 ? `blur(${bl.toFixed(2)}px)` : 'none';
      logoEl.style.width = s + 'px'; logoEl.style.height = s + 'px';
      logoEl.style.transform = `translate(${(x - s / 2).toFixed(2)}px,${(y - s / 2).toFixed(2)}px) scale(${(.9 + .1 * Vg.v).toFixed(4)})`;
    } else hide(logoEl);
    const img = (el, y, w, ar, a, z) => {
      const V = vis(t, a, z, .4, .14);
      if (V.v < .003) return hide(el);
      showEl(el); const h = w * ar;
      const rev = V.s > 0 ? eOut3(c01(since(t, a) / .42)) : 1;
      el.style.width = w + 'px'; el.style.height = h + 'px';
      el.style.transform = `translate(${540 - w / 2}px,${(y - h / 2 - (V.s < 0 ? (1 - V.v) * 10 : 0)).toFixed(2)}px)`;
      el.style.clipPath = `inset(-4px -4px -4px ${((1 - rev) * 100).toFixed(2)}%)`;
      el.style.opacity = V.s < 0 ? V.v : 1;
      el.style.filter = V.s < 0 && V.v < .99 ? `blur(${((1 - V.v) * 10).toFixed(2)}px)` : 'none';
    };
    img(ctName, L.name, 620, 155 / 1158, b(62), b(69));
    img(ctSub, L.sub, 290, 88 / 524, b(63), b(69) + .02);
    const Vd = vis(t, b(63), b(69) + .03, .5, .14);
    if (Vd.v > .003) { showEl(ctDiv); ctDiv.style.opacity = Vd.v; box(ctDiv, 540, L.div, 680 * (Vd.s > 0 ? eOut3(Vd.v) : 1), 2); } else hide(ctDiv);
    place(ctLead, 540, L.lead, vis(t, b(60) + .18, b(69) + .02, .3, .14), { anchor: 'c', dy: 16 });
    const Vn = vis(t, b(61), b(69) + .04, .2, .14);
    if (place(ctNum, W.numLeft ?? 100, L.num, Vn, { anchor: 'l', dy: 0, blur: 0 })) {
      odo.forEach(o => { if (o.strip) { const pos = o.tr.at(t); o.strip.style.transform = `translateY(${(-pos).toFixed(4)}em)`; } });
    }
    CHIPS.forEach((c, i) => { const V = vis(t, b(64) + i * .06, b(69) + .05, .3, .14); c._V = V; });
    { const gap = 34; const tot = W.chips.reduce((a, c) => a + c, 0) + gap * 2; let x = 540 + tot / 2;
      CHIPS.forEach((c, i) => { place(c, x, L.chips, c._V, { dy: 14 }); x -= W.chips[i] + gap; }); }
    place(ctHandle, 540, L.handle, vis(t, b(65), b(69) + .06, .32, .14), { anchor: 'c', dy: 18, scale: .06 });
    // ripple from the call button
    const dR = since(t, inWin(t, b(67), b(69)) ? b(67) : b(66));
    if (dR < .75 && inWin(t, b(66), b(69))) {
      showEl(mRing); const p = eOut3(dR / .75); const sz = CALLBTN.d + 150 * p;
      mRing.style.opacity = (1 - p) * .9; box(mRing, CALLBTN.x, CALLBTN.y, sz, sz, sz / 2);
    } else hide(mRing);
  }

  // ---------- media element ----------
  {
    let mx = MD.x.at(t), my = MD.y.at(t), mw = Math.max(0, MD.w.at(t)), mh = Math.max(0, MD.h.at(t)), mr = Math.max(0, MD.r.at(t));
    const mo = c01(MD.o.at(t));
    let g = 1;
    if (t >= CALL.grab && t < b(60)) {
      const k = knobAt(t);
      g = k.g; mx = k.kx; my = KNOB.y; mw = KNOB.d + k.st; mh = KNOB.d; mr = KNOB.d / 2;
    }
    const pressB = pulse(t, b(66), -.08);
    const on = mo > .003 && mw > 1 && mh > 1 && t >= b(24);
    disp(media, on);
    if (!on) hide(wayChip);
    if (on) {
      media.style.opacity = mo;
      media.style.width = mw.toFixed(2) + 'px'; media.style.height = mh.toFixed(2) + 'px';
      media.style.borderRadius = Math.min(mr, mw / 2, mh / 2).toFixed(2) + 'px';
      media.style.transform = `translate(${(mx - mw / 2).toFixed(2)}px,${(my - mh / 2).toFixed(2)}px) scale(${(g * (1 + pressB)).toFixed(4)})`;
      const si = segAt(t);
      // bottom layer = previous clip while the new one blurs in on top
      let bottom = null, top = null, a = 1;
      if (si >= 0) {
        const seg = SEGS[si];
        a = eOut3(c01((t - seg.t0) / .32));
        if (si > 0 && a < 1) { bottom = SEGS[si - 1]; top = seg; } else bottom = seg;
      }
      [[mImg[0], bottom, 1], [mImg[1], top, a]].forEach(([im, seg, al]) => {
        if (!seg) { hide(im); return; }
        showEl(im);
        frameImg(im, seg, t, mw, mh);
        pending.add(im);
        im.style.opacity = al;
        im.style.filter = al < 1 ? `blur(${((1 - al) * 7).toFixed(2)}px)` : 'none';
      });
      place(wayChip, mx, Math.min(my + mh / 2 - 96, 1390), vis(t, b(25), b(27), .32, .14), { anchor: 'c', dy: 18, blur: 10, scale: .08 });
      const Vi = vis(t, CALL.rel, b(69), .22, .14);
      if (Vi.v > .003) { showEl(mIcon); mIcon.style.opacity = Vi.v; mIconSvg.style.transform = `translate(-50%,-50%) scale(${(.6 + .4 * Vi.v).toFixed(4)})`; } else hide(mIcon);
    }
  }

  // ---------- cursor ----------
  {
    const c = CUR_AT(t);
    const [x, y] = toScreen(cam, c.x, c.y);
    let pr = 0;
    for (const tc of CLICKS) if (tc !== HERO.grab && tc !== CALL.grab) pr += pulse(t, tc, -.14);
    for (const [g0, g1] of [[HERO.grab, HERO.rel], [CALL.grab, CALL.rel]]) {
      if (t >= g0 - .1 && t < g1) pr += -.13 * S(t - (g0 - .07), .16, .9);
      else if (t >= g1 && t < g1 + 1.5) pr += -.13 * (1 - S(t - g1, .3, .85));
    }
    const s = 1.4 * Math.pow(cam.z, .32) * (1 + pr);
    cursorEl.style.transform = `translate(${x.toFixed(2)}px,${y.toFixed(2)}px) scale(${s.toFixed(4)})`;
    cursorEl.style.visibility = (x > -120 && x < 1200 && y > -120 && y < 2050) ? 'visible' : 'hidden';
  }

  // wait for every image this frame uses
  const ps = [...pending].map(im => (im.complete && im.naturalWidth) ? im.decode().catch(() => {}) : new Promise(r => { im.onload = im.onerror = () => r(); }).then(() => im.decode().catch(() => {})));
  pending.clear();
  await Promise.all(ps);
}

window.REEL = { T, BPM, NB, BEAT, EVENTS, seek, curves: r => curves(r), ready: init().then(() => true) };
})();
</script>
</body>
</html>
